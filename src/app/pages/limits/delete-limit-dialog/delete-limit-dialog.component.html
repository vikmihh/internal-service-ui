<mat-dialog-content>
  <p class="dialog-prompt">Select deletion reason and confirm:</p>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Cancellation reason</mat-label>
      <mat-select formControlName="cancellationReason">
        @for (reason of cancellationReasons; track reason) {
          <mat-option [value]="reason">{{ reason }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button (click)="save()" [disabled]="saving()">Save</button>
</mat-dialog-actions>
